spring.application.name=huddle

# .env loading
spring.config.import=optional:file:.env[.properties]

# DataSource
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME:huddle}
spring.datasource.username=${DB_USERNAME:huddle_app}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# spring.jpa.properties.hibernate.format_sql=true
# spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true

# Auth
# GOOGLE_CLIENT_ID is the *Web* OAuth client id: the mobile app passes the same value as
# `webClientId` to GoogleSignin.configure(), and it's the `aud` we require on incoming ID tokens.
# JWT_SECRET signs our own access tokens (HS256, so >= 32 bytes). Both live in apps/api/.env.
huddle.auth.google-client-id=${GOOGLE_CLIENT_ID}
huddle.auth.jwt-secret=${JWT_SECRET}
huddle.auth.issuer=https://huddle.app
huddle.auth.access-token-ttl=15m
huddle.auth.refresh-token-ttl=30d
huddle.auth.allowed-email-domain=cornell.edu
