# Test-only auth config.
#
# The main application.properties requires GOOGLE_CLIENT_ID / JWT_SECRET from apps/api/.env and
# fails startup without them — deliberately, so a misconfigured deployment can't quietly accept the
# wrong audience. Tests activate the "test" profile instead, whose values take precedence, so the
# unresolvable ${...} placeholders are never evaluated.
huddle.auth.google-client-id=test-google-client-id.apps.googleusercontent.com
huddle.auth.jwt-secret=test-signing-secret-not-used-anywhere-real-0123456789
huddle.auth.issuer=https://huddle.test
huddle.auth.access-token-ttl=15m
huddle.auth.refresh-token-ttl=30d
huddle.auth.allowed-email-domain=cornell.edu